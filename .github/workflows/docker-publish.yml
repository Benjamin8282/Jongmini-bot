name: Build, Push and Recreate on Portainer

on:
  push:
    branches:
      - release/latest

jobs:
  build-push-recreate:
    runs-on: ubuntu-latest

    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_USERNAME: ${{ secrets.PORTAINER_USERNAME }}
      PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
      ENDPOINT_ID: ${{ secrets.ENDPOINT_ID }}
      CONTAINER_NAME: jongmini-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build -t kangjongwoo333/jongmini-bot:latest .

      - name: Push the Docker image
        run: docker push kangjongwoo333/jongmini-bot:latest

      - name: Get Portainer JWT token
        id: portainer_auth
        run: |
          TOKEN=$(curl -sk -X POST "$PORTAINER_URL/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"Username\":\"$PORTAINER_USERNAME\",\"Password\":\"$PORTAINER_PASSWORD\"}" | jq -r '.jwt')
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get container ID by name from Portainer
        id: get_container_id
        run: |
          CONTAINER_ID=$(curl -sk -X GET "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/json?all=1" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r --arg NAME "/$CONTAINER_NAME" '.[] | select(.Names[]==$NAME) | .Id')
          if [ -z "$CONTAINER_ID" ]; then
            echo "Container not found!" >&2
            exit 1
          fi
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV

      - name: Wait for Docker Hub to update image
        run: sleep 20

      - name: Recreate container in Portainer
        run: |
          curl -sk -X POST "$PORTAINER_URL/api/docker/$ENDPOINT_ID/containers/$CONTAINER_ID/recreate" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pullImage": true}'